name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} · SQLite
    strategy:
      fail-fast: false
      matrix:
        # 8.3 is what the hosting runs (PANEL_DOC Section 4). 8.4 is there so a
        # version bump on the server is not the first time the suite sees it.
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, intl, gd, openssl, posix
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate

      # PANEL_DOC Section 10: the panel reuses the shop system's look by copying
      # its compiled build/ in at deploy time. That is a real coupling between
      # two repositories and nothing was checking it — BorrowedStylesheetTest
      # skips itself when public/build is absent, which in CI was always. So the
      # one check that would catch "the shop system renamed a Vite entry and now
      # every panel page throws" never ran anywhere at all.
      #
      # Only build/ is taken, not the whole system: it is the single thing that
      # crosses, and a sparse checkout keeps it that way.
      - name: Borrow the shop system's compiled assets
        uses: actions/checkout@v4
        with:
          repository: ittz-soran/SystemManagment
          path: .shop-system
          sparse-checkout: public/build
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Put them where a deploy would
        run: cp -r .shop-system/public/build public/build

      - run: php artisan test

  mariadb:
    runs-on: ubuntu-latest
    name: PHP 8.3 · MariaDB

    # PANEL_DOC Section 1: "If a change depends on MySQL, a browser, or Apache,
    # test it there." The project has already shipped a MariaDB reserved word
    # that SQLite accepted. The suite runs on both engines so it cannot happen
    # a second time without CI saying so.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: soran_panel_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, intl, gd, openssl, posix
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate

      # PanelBackup shells out to mysqldump and mysql. Without them the panel's
      # own backup and — more to the point — the restore drill skip themselves,
      # and Section 13 calls losing this database worse than losing any one
      # shop. A skipped drill is not a drill.
      - name: Install the client tools the backup shells out to
        run: sudo apt-get install -y --no-install-recommends mariadb-client

      # PANEL_DOC Section 10: the panel reuses the shop system's look by copying
      # its compiled build/ in at deploy time. That is a real coupling between
      # two repositories and nothing was checking it — BorrowedStylesheetTest
      # skips itself when public/build is absent, which in CI was always. So the
      # one check that would catch "the shop system renamed a Vite entry and now
      # every panel page throws" never ran anywhere at all.
      #
      # Only build/ is taken, not the whole system: it is the single thing that
      # crosses, and a sparse checkout keeps it that way.
      - name: Borrow the shop system's compiled assets
        uses: actions/checkout@v4
        with:
          repository: ittz-soran/SystemManagment
          path: .shop-system
          sparse-checkout: public/build
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Put them where a deploy would
        run: cp -r .shop-system/public/build public/build

      - name: Execute tests against MariaDB
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: soran_panel_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php vendor/bin/phpunit

  style:
    runs-on: ubuntu-latest
    name: Pint
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: ./vendor/bin/pint --test
